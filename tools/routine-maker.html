<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Routine Image Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@600;700&family=Poppins:wght@600;700&family=Hind+Siliguri:wght@500;700&family=Noto+Sans+Bengali:wght@600;800&family=Anek+Bangla:wght@600;800&family=Baloo+Da+2:wght@600;800&family=Noto+Serif+Bengali:wght@600;800&family=Galada&family=Atma:wght@600;700&family=Mina:wght@700&family=Tiro+Bangla&family=Bebas+Neue&family=Audiowide&family=Russo+One&family=Exo+2:wght@600;800&family=Righteous&family=Chakra+Petch:wght@600;700&family=Bungee&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"SolaimanLipi";src:url("fonts/SolaimanLipi.ttf"),url("fonts/solaimanlipi.ttf")}
:root{--bg:#15171c;--pn:#1e2128;--ln:#343944;--tx:#e9eaee;--mu:#9aa0ad;--ac:#ff5fb8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,"Noto Sans Bengali",sans-serif}
.app{display:grid;grid-template-columns:minmax(300px,460px) 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.prev{position:sticky;top:16px;align-self:start}
@media(max-width:900px){.prev{position:static}}
canvas{width:100%;height:auto;max-height:82vh;object-fit:contain;display:block;background:#000;border-radius:8px;border:1px solid var(--ln)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,.btn{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:8px 12px;cursor:pointer;font:inherit}
button:hover,.btn:hover{border-color:var(--ac)}
button.pri{background:var(--ac);border-color:var(--ac);color:#1a0010;font-weight:700}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label{display:block;color:var(--mu);font-size:12px}
input,select{width:100%;background:#12141a;color:var(--tx);border:1px solid var(--ln);border-radius:5px;padding:6px 8px;font:inherit}
input[type=color]{padding:0;height:28px;min-width:34px;cursor:pointer}
input[type=range]{padding:0}
.sc{overflow-x:auto}
table{border-collapse:collapse;min-width:100%}
th,td{border:1px solid var(--ln);padding:4px;vertical-align:top;min-width:96px}
th{background:#252932;font-weight:600}
td input,th input{margin-bottom:3px}
td button,th button{padding:2px 8px;font-size:12px}
.nt{display:grid;grid-template-columns:50px 60px 90px 1fr 1fr 40px auto;gap:4px;margin-bottom:6px;align-items:center}
@media(max-width:700px){.nt{grid-template-columns:1fr 1fr 1fr}}
.hint{color:var(--mu);font-size:12px;margin:6px 0 0}
</style></head><body>
<div class="app">
 <div class="prev">
  <canvas id="cv" width="1080" height="1440"></canvas>
  <div class="bar">
   <button class="pri" id="dl">Download PNG</button>
   <button id="sv">Save project</button>
   <label class="btn" style="color:var(--tx)">Open project<input type="file" id="ld" accept=".json" hidden></label>
   <button id="rs">Reset</button>
  </div>
 </div>
 <div id="ed"></div>
</div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv');let x,S,BG=null;
const KEY='routine-maker-v1',BLUE='#5cc8ff',GRN='#5cff7a',YEL='#ffd84a',RED='#ff5a4a',PNK='#ff6ad5';
const R=(d,m,day,c)=>({d,m,day,cells:c.map(a=>({t:a[0],s:a[1],c:a[2]}))});
const PRE={neon:{head:'glass',date:'glass',day:'wood',cell:'glass',note:'glass'},plain:{head:'silver',date:'matte',day:'silver',cell:'silver',note:'matte'},glossy:{head:'silver',date:'glossy',day:'wood',cell:'glossy',note:'glossy'},metal:{head:'silver',date:'gold',day:'silver',cell:'silver',note:'gold'},acrylic:{head:'acrylic',date:'acrylic',day:'wood',cell:'acrylic',note:'acrylic'}},MATS=['glass','glossy','matte','acrylic','silver','gold','carbon','wood'];
function def(){return{tb:{st:'stepped',mat:'silver',mc:'#ff6ad5',frame:'on',fc:'#151515',tc:'#1c1c1c',txt:'engraved',w:52,h:13,sz:100},mats:{...PRE.neon},shape:'slanted',op:1,W:1080,H:1440,font:'Orbitron',style:'neon',glow:18,pins:'on',dateColor:PNK,
 bg:{mode:'wood',c1:'#3b2c24',c2:'#120e0c'},
 title:{a:'CLASS 11',b:'[HSC 2028]'},sub:'ONE WEEK CLASS & EXAM ROUTINE',headDate:'Date & Day',
 head:[{t:'Class',s:'[With Lecture]',c:'#e8e8e8'},{t:'Exam',s:'[With Lecture]',c:'#e8e8e8'}],
 rows:[R('15','nov','Sunday',[['H.Math','[L 21+22]',BLUE],['H.Math','[L 19+20]',BLUE]]),
  R('16','nov','Monday',[['Biology','[L 03+04]',GRN],['H.Math','[L 21+22]',BLUE]]),
  R('17','nov','Tuesday',[['Physics','[L 11+12]',YEL],['Biology','[L 03+04]',GRN]]),
  R('18','nov','Wednesday',[['Physics','[L 13+14]',YEL],['Physics','[L 11+12]',YEL]]),
  R('19','nov','Thursday',[['Chemistry','[L 13+14]',RED],['Physics','[L 13+14]',YEL]])],
 notes:[{d:'20',m:'nov',day:'Friday',t:'Chapter wise Exam',s:'Physics - Chapter 02 (Lecture 03-14)',c:RED}]}}
try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY)))}catch(e){S=def()}
const hex=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};
const F=(s,w=700)=>`${w} ${s}px "${S.font}","Noto Sans Bengali","Hind Siliguri",sans-serif`;
function para(X,Y,w,h){const sh=S.shape||'slanted',k=sh=='slanted'?h*.12:0;x.beginPath();if(sh=='rounded'){const r=h*.28;x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r)}else{x.moveTo(X+k,Y);x.lineTo(X+w,Y);x.lineTo(X+w-k,Y+h);x.lineTo(X,Y+h)}x.closePath()}
function T(str,cx,cy,mw,sz,col,w,g){if(!str)return;let s=sz;x.font=F(s,w);while(x.measureText(str).width>mw&&s>8){s--;x.font=F(s,w)}x.save();if(g){x.shadowColor=g;x.shadowBlur=S.glow*.5}x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';x.fillText(str,cx,cy);x.restore()}
const E=(t,cx,cy,mw,sz,w)=>{T(t,cx+1.5,cy+1.5,mw,sz,'rgba(255,255,255,.55)',w);T(t,cx,cy,mw,sz,'#1c1c1c',w)};
const emboss=(t,cx,cy,mw,sz)=>{for(let i=6;i>0;i--)T(t,cx+i*.8,cy+i*.9,mw,sz,'#2b2b2b',700);T(t,cx,cy,mw,sz,'#dcdcdc',700)};
const shade=(h,f)=>{const n=parseInt(h.slice(1),16),m=v=>Math.round(f<1?v*f:v+(255-v)*(f-1));return`rgb(${m(n>>16)},${m(n>>8&255)},${m(n&255)})`},lite=h=>shade(h,1.35),lum=h=>{const n=parseInt(h.slice(1),16);return((n>>16)*.299+(n>>8&255)*.587+(n&255)*.114)/255};
function pins(X,Y,w,h){if(S.pins!='on'||h<40)return;const k=(S.shape||'slanted')=='slanted'?h*.12:0,r=Math.max(3,h*.04),i=r*2.6+(S.shape=='rounded'?h*.06:0);
 [[X+k+i,Y+i],[X+w-i,Y+i],[X+i,Y+h-i],[X+w-k-i,Y+h-i]].forEach(([a,b])=>{const g=x.createRadialGradient(a-r*.3,b-r*.3,0,a,b,r);g.addColorStop(0,'#f2f2f2');g.addColorStop(1,'#555');x.beginPath();x.arc(a,b,r,0,7);x.fillStyle=g;x.fill();x.strokeStyle='rgba(0,0,0,.6)';x.lineWidth=1;x.stroke()})}
const TT=(t,cx,cy,mw,sz,w)=>{const c=S.tb.tc,m=S.tb.txt;
 if(m=='engraved'){T(t,cx+1.5,cy+1.5,mw,sz,'rgba(255,255,255,.5)',w);T(t,cx,cy,mw,sz,c,w)}
 else if(m=='raised'){for(let i=5;i>0;i--)T(t,cx+i*.8,cy+i*.9,mw,sz,'rgba(0,0,0,.55)',w);T(t,cx,cy,mw,sz,c,w)}
 else T(t,cx,cy,mw,sz,c,w)};
const PAL={silver:['#dadada','#a2a2a2','#eee','#989898','#c6c6c6'],gold:['#f1dc8a','#b8892c','#fbeaa6','#9a7020','#d9b24a'],gunmetal:['#6a7078','#3a3f46','#7d848c','#2c3036','#555b63'],copper:['#e8a075','#a65a35','#f4b790','#8a4527','#c9743f']};
function plate(X,Y,w,h){const B=S.tb,st=B.st,k=st=='rounded'||st=='banner'?0:h*.2,r=h*.1,o=h*.07,q=k*.6,dy=st=='stepped'?h*.14:0;
 const M=(d,e)=>{x.beginPath();
  if(st=='banner'){const R=h*.6;x.moveTo(-20+d,-20+e);x.lineTo(X+w+d,-20+e);x.lineTo(X+w+d,Y+h-R+e);x.arcTo(X+w+d,Y+h+e,X+w-R+d,Y+h+e,R);x.lineTo(-20+d,Y+h+e)}
  else if(st=='rounded'){const R=h*.32;x.moveTo(X+R+d,Y+e);x.arcTo(X+w+d,Y+e,X+w+d,Y+h+e,R);x.arcTo(X+w+d,Y+h+e,X+d,Y+h+e,R);x.arcTo(X+d,Y+h+e,X+d,Y+e,R);x.arcTo(X+d,Y+e,X+w+d,Y+e,R)}
  else{x.moveTo(X+k+d,Y+e);x.lineTo(X+w*.74+d,Y+e);x.lineTo(X+w*.74+dy+d,Y+dy+e);x.lineTo(X+w-r+d,Y+dy+e);x.arcTo(X+w+d,Y+dy+e,X+w-q+d,Y+h+e,r);x.arcTo(X+w-q+d,Y+h+e,X+d,Y+h+e,r);x.lineTo(X+d,Y+h+e)}
  x.closePath()};
 const L=(pts,col,lw,dx=0)=>{x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0]+dx,p[1]+dx):x.moveTo(p[0]+dx,p[1]+dx));x.strokeStyle=col;x.lineWidth=lw;x.stroke()};
 if(B.frame=='on'&&(st=='stepped'||st=='slanted')){
  const fr=[[[X+k-o*1.6+w*.22,Y-o*1.1],[X+k-o*1.6,Y-o*1.1],[X-o*1.6,Y+h+o*.7]],[[X+w+o*1.5,Y+dy+h*.05],[X+w-q+o*1.5,Y+h+o*.9],[X+w-q-w*.3,Y+h+o*.9]]];
  x.save();x.lineCap='round';x.lineJoin='round';x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=10;fr.forEach(f=>L(f,B.fc,h*.05));x.restore();
  x.save();x.lineCap='round';x.lineJoin='round';fr.forEach(f=>L(f,'rgba(255,255,255,.3)',1.5,-h*.012));x.restore()}
 x.save();x.shadowColor='rgba(0,0,0,.75)';x.shadowBlur=28;x.shadowOffsetY=10;M(0,0);x.fillStyle='#888';x.fill();x.restore();
 M(0,0);
 if(PAL[B.mat]){const P=PAL[B.mat],g=x.createLinearGradient(X,Y,X+w*.8,Y+h);P.forEach((c,i)=>g.addColorStop([0,.25,.5,.72,1][i],c));x.fillStyle=g;x.fill();
  x.save();M(0,0);x.clip();for(let yy=Y;yy<Y+h;yy+=2){const v=(yy*37%11)/11;x.fillStyle=v>.5?`rgba(255,255,255,${.04+v*.07})`:`rgba(0,0,0,${.03+v*.08})`;x.fillRect(0,yy,X+w+20,1)}
  x.lineWidth=5;x.strokeStyle='rgba(255,255,255,.4)';M(0,0);x.stroke();x.restore();M(0,0);x.strokeStyle=shade(P[3],.5);x.lineWidth=1.5;x.stroke()}
 else if(B.mat=='matte'){x.fillStyle=B.mc;x.fill();const g=x.createLinearGradient(0,Y,0,Y+h);g.addColorStop(0,'rgba(255,255,255,.28)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.2)');x.fillStyle=g;x.fill();M(0,0);x.strokeStyle='rgba(0,0,0,.45)';x.lineWidth=2;x.stroke()}
 else{x.fillStyle='rgba(12,9,9,.65)';x.fill();const g=x.createLinearGradient(0,Y,0,Y+h*.6);g.addColorStop(0,'rgba(255,255,255,.16)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fill();
  x.save();x.shadowColor=B.mc;x.shadowBlur=S.glow*1.4;x.lineWidth=4;x.strokeStyle=B.mc;M(0,0);x.stroke();x.restore();x.lineWidth=1.5;x.strokeStyle='rgba(255,255,255,.7)';M(0,0);x.stroke()}}
// modes: s silver, f solid colour, n neon glass, d dark plate
function box(X,Y,w,h,col,m){x.save();x.globalAlpha=S.op??1;para(X,Y,w,h);
 if(m=='silver'||m=='gold'){const g=x.createLinearGradient(0,Y,0,Y+h),A=m=='gold'?['#fff0b0','#d2a53a','#8c6420']:['#f6f6f6','#cfd2d6','#b7bbc0'];g.addColorStop(0,A[0]);g.addColorStop(.5,A[1]);g.addColorStop(1,A[2]);x.fillStyle=g;x.fill();x.strokeStyle=m=='gold'?'#5a3f10':'#4a4d52';x.lineWidth=2;x.stroke();pins(X,Y,w,h)}
 else if(m=='matte'){x.fillStyle=col;x.fill();x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=2;x.stroke()}
 else if(m=='glossy'){const g=x.createLinearGradient(0,Y,0,Y+h);g.addColorStop(0,shade(col,1.25));g.addColorStop(.5,col);g.addColorStop(1,shade(col,.7));x.fillStyle=g;x.fill();
  x.save();x.clip();x.fillStyle='rgba(255,255,255,.28)';x.fillRect(X-2,Y,w+4,h*.48);const q=x.createLinearGradient(X,0,X+w,0);q.addColorStop(0,'rgba(255,255,255,0)');q.addColorStop(.3,'rgba(255,255,255,.22)');q.addColorStop(.45,'rgba(255,255,255,0)');x.fillStyle=q;x.fillRect(X,Y,w,h);x.restore();
  para(X,Y,w,h);x.strokeStyle=shade(col,.5);x.lineWidth=2;x.stroke();pins(X,Y,w,h)}
 else if(m=='acrylic'){x.fillStyle=hex(col,.38);x.fill();const g=x.createLinearGradient(X,Y,X+w,Y+h);g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(.5,'rgba(255,255,255,.05)');g.addColorStop(1,'rgba(255,255,255,.2)');x.fillStyle=g;x.fill();x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=2.5;x.stroke();pins(X,Y,w,h)}
 else if(m=='carbon'){x.fillStyle='#14161a';x.fill();x.save();x.clip();for(let yy=Y;yy<Y+h;yy+=8)for(let xx=X;xx<X+w;xx+=8){x.fillStyle=Math.round((xx-X+yy-Y)/8)&1?'rgba(255,255,255,.07)':'rgba(0,0,0,.35)';x.fillRect(xx,yy,7,7)}x.restore();
  x.save();x.shadowColor=col;x.shadowBlur=S.glow;x.lineWidth=3;x.strokeStyle=col;para(X,Y,w,h);x.stroke();x.restore();pins(X,Y,w,h)}
 else if(m=='wood'){x.fillStyle='rgba(22,15,11,.75)';x.fill();x.strokeStyle='rgba(255,255,255,.1)';x.lineWidth=2;x.stroke()}
 else{x.fillStyle='rgba(12,9,9,.6)';x.fill();x.fillStyle=hex(col,.07);x.fill();
  const g=x.createLinearGradient(0,Y,0,Y+h*.6);g.addColorStop(0,'rgba(255,255,255,.15)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fill();
  x.save();x.clip();x.lineWidth=14;x.strokeStyle=hex(col,.3);x.shadowColor=col;x.shadowBlur=S.glow*.6;para(X,Y,w,h);x.stroke();x.restore();
  x.save();x.shadowColor=col;x.shadowBlur=S.glow*1.4;x.lineWidth=4;x.strokeStyle=col;para(X,Y,w,h);x.stroke();x.restore();
  x.lineWidth=1.5;x.strokeStyle='rgba(255,255,255,.7)';para(X,Y,w,h);x.stroke();pins(X,Y,w,h)}
 x.restore()}
const tcol=(m,c)=>m=='silver'?'#111':m=='gold'?'#2a1a00':m=='wood'?'#bdbdbd':m=='glossy'||m=='matte'||m=='acrylic'?(lum(c)>.62?'#111':'#fff'):lite(c);
function cell(X,Y,w,h,t,s,c,m){box(X,Y,w,h,c,m);const tc=tcol(m,c),cx=X+w/2+h*.05,g=(m=='glass'||m=='carbon')?c:0;
 if(s){T(t,cx,Y+h*.37,w*.84,h*.36,tc,700,g);T(s,cx,Y+h*.74,w*.84,h*.21,tc,600,g)}else T(t,cx,Y+h/2,w*.84,h*.4,tc,700,g)}
function dateCell(X,Y,w,h,r,c,m){box(X,Y,w,h,c,m);const tc=tcol(m,c),cx=X+w/2+h*.05,g=(m=='glass'||m=='carbon')?c:0;
 if(r.day!==undefined){T(r.d,cx,Y+h*.3,w*.8,h*.36,tc,700,g);T(r.m,cx,Y+h*.58,w*.8,h*.2,tc,700,g);T(r.day,cx,Y+h*.83,w*.85,h*.15,tc,600,g)}
 else{T(r.d,cx,Y+h*.38,w*.8,h*.5,tc,700,g);T(r.m,cx,Y+h*.78,w*.8,h*.24,tc,700,g)}}
function drawBg(){const W=S.W,H=S.H,b=S.bg;
 if(b.mode=='image'&&BG){const r=Math.max(W/BG.width,H/BG.height),w=BG.width*r,h=BG.height*r;x.drawImage(BG,(W-w)/2,(H-h)/2,w,h);return}
 if(b.mode=='solid'){x.fillStyle=b.c1;x.fillRect(0,0,W,H);return}

 if(['carbon','metal','concrete','chalk','navy','grid','bokeh'].includes(b.mode)){const m=b.mode;let s=5;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  const g=x.createLinearGradient(0,0,m=='metal'?W:W*.3,H);g.addColorStop(0,b.c1);g.addColorStop(1,b.c2);x.fillStyle=g;x.fillRect(0,0,W,H);
  const noise=(n,a)=>{for(let i=0;i<n;i++){x.fillStyle=rnd()>.5?`rgba(0,0,0,${rnd()*a})`:`rgba(255,255,255,${rnd()*a})`;x.fillRect(rnd()*W,rnd()*H,1+rnd()*1.5,1+rnd()*1.5)}};
  const glow=(cx,cy,r,col)=>{const q=x.createRadialGradient(cx,cy,0,cx,cy,r);q.addColorStop(0,col);q.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=q;x.fillRect(0,0,W,H)};
  if(m=='carbon'){const t=14;for(let yy=0;yy<H;yy+=t)for(let xx=0;xx<W;xx+=t){const o=((xx+yy)/t)&1,q=x.createLinearGradient(xx,yy,o?xx+t:xx,o?yy:yy+t);q.addColorStop(0,'rgba(255,255,255,.08)');q.addColorStop(1,'rgba(0,0,0,.32)');x.fillStyle=q;x.fillRect(xx,yy,t-1,t-1)}}
  if(m=='metal'){for(let i=0;i<1100;i++){x.fillStyle=rnd()>.5?`rgba(255,255,255,${rnd()*.08})`:`rgba(0,0,0,${rnd()*.12})`;x.fillRect(rnd()*W,rnd()*H,40+rnd()*320,1)}noise(4000,.1)}
  if(m=='concrete'){noise(24000,.3);for(let i=0;i<32;i++)glow(rnd()*W,rnd()*H,80+rnd()*220,'rgba(0,0,0,.14)');for(let i=0;i<14;i++){x.strokeStyle='rgba(0,0,0,.22)';x.lineWidth=1;x.beginPath();let a=rnd()*W,c=rnd()*H;x.moveTo(a,c);for(let k=0;k<6;k++){a+=rnd()*60-30;c+=rnd()*50;x.lineTo(a,c)}x.stroke()}}
  if(m=='chalk'){for(let i=0;i<26;i++)glow(rnd()*W,rnd()*H,100+rnd()*260,'rgba(255,255,255,.06)');noise(9000,.14);for(let i=0;i<90;i++){x.strokeStyle=`rgba(255,255,255,${.04+rnd()*.07})`;x.lineWidth=1+rnd()*2;x.beginPath();const a=rnd()*W,c=rnd()*H;x.moveTo(a,c);x.lineTo(a+rnd()*120-60,c+rnd()*30-15);x.stroke()}x.strokeStyle='#6b4a2b';x.lineWidth=20;x.strokeRect(10,10,W-20,H-20);x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=3;x.strokeRect(21,21,W-42,H-42)}
  if(m=='navy'){glow(W*.85,H*.92,H*.7,'rgba(34,224,138,.24)');glow(W*.1,H*.05,H*.6,'rgba(60,140,255,.22)');x.strokeStyle='rgba(255,255,255,.05)';x.lineWidth=1;for(let a=0;a<W;a+=60){x.beginPath();x.moveTo(a,0);x.lineTo(a,H);x.stroke()}for(let c=0;c<H;c+=60){x.beginPath();x.moveTo(0,c);x.lineTo(W,c);x.stroke()}noise(4000,.07)}

 cell(m,y,dW+yW+sk,rh,S.headDate,'',S.dateColor,MT.head);

  cell(m+dW+sk,y,W-2*m-dW-sk,rh,o.t,o.s,o.c,MT.note);y+=rh+gap});
